name: Publish Python package

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
    steps:
      - name: Check out the publication source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Read and validate publication metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          package_version="$(
            uv run --no-project python - <<'PY'
          from pathlib import Path
          import tomllib

          with Path("pyproject.toml").open("rb") as pyproject_file:
              print(tomllib.load(pyproject_file)["project"]["version"])
          PY
          )"
          test -n "$package_version"
          if [ -n "$RELEASE_TAG" ]; then
            expected_tag="v${package_version}"
            test "$RELEASE_TAG" = "$expected_tag" || {
              echo "Release tag must be ${expected_tag}, but was ${RELEASE_TAG}." >&2
              exit 1
            }
          fi
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx --from "twine==6.2.0" twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          uvx --refresh --isolated --from "$wheel_path" \
            uv-torch-compass --version
          uvx --refresh --isolated --from "$wheel_path" \
            uv-torch-compass --help
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/uv-torch-compass/${{ needs.build.outputs.package_version }}
    permissions:
      actions: read # Downloads the distributions built in this workflow run.
      contents: read # Retains read-only access while all write scopes stay disabled.
      id-token: write # Exchanges GitHub's OIDC identity for a TestPyPI credential.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/uv-torch-compass/${{ needs.build.outputs.package_version }}
    permissions:
      actions: read # Downloads the distributions built in this workflow run.
      contents: read # Retains read-only access while all write scopes stay disabled.
      id-token: write # Exchanges GitHub's OIDC identity for a PyPI credential.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
