name: Real PyTorch CPU smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    name: Verify a real CPU wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize the tool
        run: uv sync --locked
      - name: Create a temporary target project
        run: |
          mkdir -p "$RUNNER_TEMP/torch-target"
          cp tests/fixtures/real-pytorch-pyproject.toml \
            "$RUNNER_TEMP/torch-target/pyproject.toml"
      - name: Detect and verify the CPU backend
        run: |
          uv run uv-torch-compass apply \
            --pyproject "$RUNNER_TEMP/torch-target/pyproject.toml" \
            --backend cpu
