name: Transitive resolver smoke test

on:
  workflow_dispatch:
    inputs:
      vllm_requirement:
        description: vLLM requirement resolved against the selected PyTorch index
        required: true
        default: vllm==0.19.1
        type: string
      backend:
        description: Official CUDA backend used for the resolution-only check
        required: true
        default: cu126
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve vLLM and transitive PyTorch packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Create a resolution-only target
        env:
          BACKEND: ${{ inputs.backend }}
          TARGET_DIR: ${{ runner.temp }}/resolver-target
          VLLM_REQUIREMENT: ${{ inputs.vllm_requirement }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          from packaging.requirements import Requirement

          backend = os.environ["BACKEND"]
          if re.fullmatch(r"cu[0-9]{2,3}", backend) is None:
              raise SystemExit("backend must use the cuNNN form")
          requirement = str(Requirement(os.environ["VLLM_REQUIREMENT"]))
          target = Path(os.environ["TARGET_DIR"])
          target.mkdir(parents=True)
          index = f"https://download.pytorch.org/whl/{backend}"
          source_lines = "\n".join(
              f'{package} = {{ index = "pytorch-{backend}" }}'
              for package in ("torch", "torchvision", "torchaudio")
          )
          (target / "pyproject.toml").write_text(
              f"""[project]
          name = "resolver-smoke"
          version = "0"
          requires-python = ">=3.12,<3.13"
          dependencies = [
              {requirement!r},
              "torch",
              "torchvision",
              "torchaudio",
          ]

          [tool.uv]
          environments = [
              "implementation_name == 'cpython' and python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
          ]
          required-environments = [
              "sys_platform == 'linux' and platform_machine == 'x86_64'",
          ]

          [tool.uv.sources]
          {source_lines}

          [[tool.uv.index]]
          name = "pytorch-{backend}"
          url = "{index}"
          explicit = true
          """,
              encoding="utf-8",
          )
          PY
      - name: Resolve the public dependency graph
        env:
          TARGET_DIR: ${{ runner.temp }}/resolver-target
        run: uv lock --project "$TARGET_DIR" --python 3.12
      - name: Verify the locked package identities
        env:
          BACKEND: ${{ inputs.backend }}
          TARGET_DIR: ${{ runner.temp }}/resolver-target
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          lock = tomllib.loads(
              (Path(os.environ["TARGET_DIR"]) / "uv.lock").read_text(encoding="utf-8")
          )
          packages = {item["name"]: item for item in lock["package"]}
          for name in ("vllm", "torch", "torchvision", "torchaudio"):
              if name not in packages:
                  raise SystemExit(f"{name} was not resolved")
          expected = f"/whl/{os.environ['BACKEND']}"
          for name in ("torch", "torchvision", "torchaudio"):
              registry = packages[name].get("source", {}).get("registry", "")
              if expected not in registry:
                  raise SystemExit(f"{name} resolved from an unexpected index: {registry}")
          xgrammar = packages.get("xgrammar")
          if xgrammar is not None:
              print(f"xgrammar={xgrammar['version']}")
          for name in ("torch", "torchvision", "torchaudio"):
              print(f"{name}={packages[name]['version']}")
          PY
