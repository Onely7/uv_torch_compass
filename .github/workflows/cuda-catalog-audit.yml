name: CUDA and framework compatibility catalog audit

on:
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Check catalog provenance and review age
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Verify the NVIDIA source remains reachable
        run: |
          source_url="$(
            uv run --no-project --with packaging python - <<'PY'
          from uv_torch_compass.cuda_compatibility import CATALOG_SOURCE_URL
          print(CATALOG_SOURCE_URL)
          PY
          )"
          curl --fail --silent --show-error --location \
            --max-time 30 --output /dev/null "$source_url"
      - name: Require a recent human catalog review
        run: |
          uv run --no-project --with packaging python - <<'PY'
          from datetime import date
          from uv_torch_compass.cuda_compatibility import CATALOG_REVIEWED_DATE

          reviewed = date.fromisoformat(CATALOG_REVIEWED_DATE)
          age = (date.today() - reviewed).days
          if age > 120:
              raise SystemExit(
                  f"CUDA compatibility catalog review is {age} days old; "
                  "compare it with NVIDIA release notes and update the review date."
              )
          print(f"catalog review age: {age} days")
          PY
      - name: Verify reviewed vLLM sources and published metadata
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import json
          import urllib.request
          from datetime import date

          from uv_torch_compass.vllm_compatibility import framework_catalog_metadata

          catalog = framework_catalog_metadata()
          age = (date.today() - date.fromisoformat(catalog["reviewed_date"])).days
          if age > 120:
              raise SystemExit(
                  f"vLLM compatibility catalog review is {age} days old; "
                  "review official installation and package metadata again."
              )
          for source in catalog["sources"]:
              request = urllib.request.Request(
                  source,
                  headers={"User-Agent": "uv-torch-compass-catalog-audit"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status >= 400:
                      raise SystemExit(f"catalog source is unavailable: {source}")
          for entry in catalog["entries"]:
              metadata_url = f"https://pypi.org/pypi/vllm/{entry['version']}/json"
              with urllib.request.urlopen(metadata_url, timeout=30) as response:
                  metadata = json.load(response)
              requirements = metadata["info"].get("requires_dist") or []
              relevant = [
                  item
                  for item in requirements
                  if item.lower().startswith(("torch", "nvidia-cuda"))
              ]
              print(
                  f"vllm {entry['version']} ({entry['cuda_variant']}): "
                  + (", ".join(relevant) or "no CUDA-related Requires-Dist entry")
              )
          PY
