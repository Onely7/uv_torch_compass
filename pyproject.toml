[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "uv-torch-compass"
version = "0.1.0"
description = "Detect and configure a working PyTorch backend for uv projects"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "packaging>=24.2",
    "tomli>=2.0.1,<3; python_version < '3.11'",
    "tomlkit>=0.13.2,<1",
]

[project.scripts]
uv-torch-compass = "uv_torch_compass.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PERF",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/uv_torch_compass/command_runner.py" = ["S404", "S603"]
"tests/**" = ["D", "S101"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=uv_torch_compass",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

[tool.uv.build-backend]
source-include = [
    ".github/**",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".python-version",
    "README_ja.md",
    "docs/**",
    "tests/**",
]
